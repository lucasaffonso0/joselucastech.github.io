<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LucasFlix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { lf: { red: '#E50914', dark: '#0a0a0a' } },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── LOGIN ───────────────────────────────────────────────────── -->
<div id="login-screen" class="fixed inset-0 z-[300] login-bg flex items-center justify-center p-6">
  <div class="w-full max-w-[360px] slide-up">

    <div class="flex justify-center mb-10">
      <svg viewBox="0 0 700 120" width="260" height="42" xmlns="http://www.w3.org/2000/svg">
        <text x="350" y="105" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
          font-size="108" font-weight="700" fill="#E50914" letter-spacing="3">LUCASFLIX</text>
      </svg>
    </div>

    <div class="glass-card rounded-2xl p-8">
      <h2 class="text-white text-xl font-bold mb-1">Bem-vindo de volta</h2>
      <p class="text-white/40 text-sm mb-7">Entre para continuar assistindo</p>

      <div class="flex flex-col gap-3">
        <div>
          <label class="block text-xs text-white/40 font-medium mb-1.5 ml-1">Usuário</label>
          <input id="login-user" type="text" placeholder="Digite seu usuário"
            autocomplete="username"
            class="input-field"
            onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()" />
        </div>
        <div>
          <label class="block text-xs text-white/40 font-medium mb-1.5 ml-1">Senha</label>
          <input id="login-pass" type="password" placeholder="Digite sua senha"
            autocomplete="current-password"
            class="input-field"
            onkeydown="if(event.key==='Enter')doLogin()" />
        </div>

        <p id="login-error" class="hidden text-[#E50914] text-xs text-center py-1 bg-red-500/10 rounded-md">
          Usuário ou senha incorretos
        </p>

        <button onclick="doLogin()"
          class="w-full mt-2 bg-[#E50914] hover:bg-red-600 active:bg-red-700 text-white font-bold py-3 rounded-lg transition-all duration-150 text-sm tracking-wide">
          Entrar
        </button>
      </div>
    </div>

    <p class="text-center text-white/20 text-xs mt-6">LucasFlix — Assista sem limites</p>
  </div>
</div>


<!-- ── NAVBAR ──────────────────────────────────────────────────── -->
<nav id="navbar" class="fixed top-0 left-0 right-0 z-50" style="background:linear-gradient(to bottom,rgba(10,10,10,.9),transparent)">
  <div class="flex items-center justify-between px-5 md:px-12 h-16">

    <div class="flex items-center gap-8">
      <button onclick="showHome()" class="shrink-0 flex items-center">
        <svg viewBox="0 0 700 120" width="130" height="28" xmlns="http://www.w3.org/2000/svg">
          <text x="350" y="105" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
            font-size="108" font-weight="700" fill="#E50914" letter-spacing="3">LUCASFLIX</text>
        </svg>
      </button>

      <div class="hidden md:flex items-center gap-1 text-sm">
        <button id="nav-home" onclick="showHome()" class="nav-link px-3 py-1.5 rounded-md text-white/70 hover:text-white hover:bg-white/8 transition-all">Início</button>
        <button id="nav-movie" onclick="browseType('movie')" class="nav-link px-3 py-1.5 rounded-md text-white/70 hover:text-white hover:bg-white/8 transition-all">Filmes</button>
        <button id="nav-tv" onclick="browseType('tv')" class="nav-link px-3 py-1.5 rounded-md text-white/70 hover:text-white hover:bg-white/8 transition-all">Séries</button>
        <button id="nav-anime" onclick="browseType('anime')" class="nav-link px-3 py-1.5 rounded-md text-white/70 hover:text-white hover:bg-white/8 transition-all">Animes</button>
      </div>
    </div>

    <div class="flex items-center gap-3">

      <!-- Player controls: only visible in player view -->
      <div id="nav-player-controls" class="hidden items-center gap-1">
        <button onclick="toggleSource()" class="flex items-center gap-1.5 px-3 h-8 rounded-lg text-xs text-white/70 hover:text-white hover:bg-white/8 transition-all">
          <svg class="w-[15px] h-[15px] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
          <span id="nav-source-label">Server 1</span>
        </button>
        <button onclick="reloadPlayer()" class="flex items-center gap-1.5 px-3 h-8 rounded-lg text-xs text-white/70 hover:text-white hover:bg-white/8 transition-all">
          <svg class="w-[15px] h-[15px] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Recarregar
        </button>
        <button onclick="toggleFullscreen()" class="flex items-center gap-1.5 px-3 h-8 rounded-lg text-xs text-white/70 hover:text-white hover:bg-white/8 transition-all">
          <svg class="w-[15px] h-[15px] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
          </svg>
          Tela cheia
        </button>
      </div>

      <div class="flex items-center gap-2">
        <div class="search-expand" id="search-expand-wrap">
          <input id="search-input" type="text" placeholder="Buscar…"
            class="input-field !py-2 !text-xs w-36 sm:w-52 md:w-64"
            onkeydown="if(event.key==='Enter')doSearch();if(event.key==='Escape')closeSearch()"
            onblur="closeSearch()" />
        </div>
        <button id="search-btn" onclick="toggleSearch()" onmousedown="event.preventDefault()" class="w-9 h-9 flex items-center justify-center rounded-lg text-white/70 hover:text-white hover:bg-white/8 transition-all">
          <svg class="w-4.5 h-4.5 w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </button>
      </div>

      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[#E50914] to-red-800 flex items-center justify-center text-white text-xs font-black select-none shadow-lg shadow-red-900/40">
        L
      </div>
    </div>
  </div>
</nav>

<!-- ── GENRE BAR ────────────────────────────────────────────────── -->
<div id="genre-bar" class="fixed top-16 left-0 right-0 z-40" style="background:rgba(10,10,10,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)">
  <div class="px-4 md:px-12 pt-2 pb-2 flex items-center gap-1.5 overflow-x-auto scrollbar-hide">
    <button id="gtab-movie" onclick="browseType('movie')"
      class="shrink-0 text-[11px] font-bold px-3 py-1 rounded-full border transition-all border-[#E50914] text-white bg-[#E50914]">
      Filmes
    </button>
    <button id="gtab-tv" onclick="browseType('tv')"
      class="shrink-0 text-[11px] font-bold px-3 py-1 rounded-full border transition-all border-white/15 text-white/45">
      Séries
    </button>
    <div class="w-px h-4 bg-white/10 mx-0.5 shrink-0"></div>
    <div id="genre-pills" class="flex gap-1.5 shrink-0"></div>
  </div>
</div>

<!-- ── HOME VIEW ───────────────────────────────────────────────── -->
<div id="view-home">

  <!-- Hero -->
  <div id="hero" class="relative w-full h-[92vh] min-h-[560px] overflow-hidden" style="background:var(--bg)">
    <img id="hero-img" src="" alt="" class="absolute inset-0 w-full h-full object-cover object-top transition-opacity duration-700" />
    <div class="hero-gradient-h absolute inset-0"></div>
    <div class="hero-gradient-v absolute inset-0"></div>
    <!-- subtle top shadow for navbar legibility -->
    <div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-[#0a0a0a]/60 to-transparent"></div>

    <div class="relative h-full flex flex-col justify-end pb-20 md:pb-28 px-5 md:px-16 max-w-[680px]">
      <div id="hero-badges" class="flex items-center gap-2 mb-3"></div>
      <h1 id="hero-title" class="text-[1.75rem] sm:text-4xl md:text-[3.75rem] font-black text-white mb-3 leading-[1.1] tracking-tight drop-shadow-2xl"></h1>
      <p id="hero-overview" class="text-xs md:text-[.95rem] text-white/70 mb-5 clamp3 leading-relaxed max-w-[520px]"></p>
      <div class="flex items-center gap-2.5 flex-wrap">
        <button id="hero-play" class="btn-primary !text-sm !py-2.5 !px-5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Assistir
        </button>
        <button id="hero-info" class="btn-secondary !text-sm !py-2.5 !px-5">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Mais Info
        </button>
      </div>
      <div id="hero-meta" class="flex items-center gap-3 mt-4 text-xs text-white/50"></div>
    </div>
  </div>

  <!-- Rows -->
  <div id="rows" class="mt-[-60px] md:mt-[-100px] relative z-10 pb-16 space-y-0 md:space-y-2"></div>
</div>

<!-- ── SEARCH VIEW ─────────────────────────────────────────────── -->
<div id="view-search" class="hidden pt-[120px] pb-16 px-4 md:px-12 fade-in">
  <div class="flex items-baseline gap-3 mb-8">
    <h1 id="search-title" class="text-white text-2xl font-bold"></h1>
    <span id="search-count" class="text-white/30 text-sm"></span>
  </div>
  <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-3 md:gap-4"></div>
  <div id="search-loading" class="hidden flex-col items-center gap-4 py-16">
    <div class="w-10 h-10 border-2 border-[#E50914] border-t-transparent rounded-full animate-spin"></div>
    <p class="text-white/30 text-sm">Buscando...</p>
  </div>
  <div id="search-empty" class="hidden flex-col items-center gap-3 py-20">
    <svg class="w-14 h-14 text-white/10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
    </svg>
    <p class="text-white/30 text-sm">Nenhum resultado encontrado</p>
  </div>
  <div id="pagination" class="hidden flex-wrap justify-center gap-1.5 mt-10"></div>
</div>

<!-- ── PLAYER VIEW ─────────────────────────────────────────────── -->
<div id="view-player" class="hidden fade-in" style="padding-top:64px;min-height:100vh;background:var(--bg)">
  <div class="max-w-screen-xl mx-auto pb-16">

    <!-- Back (padded) -->
    <div class="px-4 md:px-10 pt-4 pb-3">
      <button onclick="closePlayer()"
        class="inline-flex items-center gap-2 text-white/50 hover:text-white text-sm font-medium transition-colors group">
        <svg class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Voltar
      </button>
    </div>

    <!-- Layout: stacked on mobile, side-by-side on desktop -->
    <div class="flex flex-col md:flex-row md:gap-4 md:items-start md:px-10">

      <!-- Video column -->
      <div class="flex-1 min-w-0">

        <!-- Video box: edge-to-edge on mobile, rounded on desktop.
             Uses padding-bottom hack for reliable aspect-ratio across all browsers. -->
        <div id="player-box" class="relative w-full bg-black md:rounded-xl"
          style="padding-bottom:100%;height:0">
          <iframe id="player-iframe" src=""
            style="position:absolute;top:0;left:0;width:100%;height:100%;min-height:210px;border:0"
            allowfullscreen
            allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; clipboard-write *; accelerometer *; gyroscope *; web-share *"
            referrerpolicy="no-referrer"
            title="Player"></iframe>
        </div>

        <!-- Controls + title: padded on mobile -->
        <div class="px-4 md:px-0">

          <div class="flex flex-wrap items-center gap-2 mt-3">
            <button onclick="toggleSource()" id="source-btn" title="Trocar servidor de vídeo" class="player-btn">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
              </svg>
              <span id="source-label" class="btn-txt">Server 1</span>
            </button>
            <button onclick="reloadPlayer()" class="player-btn">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582M20 20v-5h-.581M5.635 19A9 9 0 1 0 4.582 9"/>
              </svg>
              <span class="btn-txt">Recarregar</span>
            </button>
            <button id="fullscreen-btn" onclick="toggleFullscreen()" class="player-btn">
              <svg id="fullscreen-icon" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
              </svg>
              <span id="fullscreen-label" class="btn-txt">Tela cheia</span>
            </button>
            <button id="episodes-toggle-btn" onclick="toggleEpisodes()"
              class="hidden player-btn !bg-[#E50914]/15 !border-[#E50914]/20 !text-[#E50914] hover:!bg-[#E50914]/25">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
              <span class="btn-txt">Episódios</span>
            </button>
          </div>

          <div class="mt-4 pb-1">
            <h1 id="player-title" class="text-white text-xl md:text-2xl font-bold leading-tight"></h1>
            <div id="player-meta-row" class="flex flex-wrap items-center gap-2.5 mt-2 text-sm text-white/50"></div>
            <p id="player-overview" class="text-white/50 text-sm leading-relaxed mt-3 max-w-3xl"></p>
          </div>

        </div>
      </div>

      <!-- Episodes sidebar: full-width on mobile, fixed on desktop -->
      <div id="episodes-sidebar" class="hidden w-full md:w-72 md:shrink-0 flex-col mt-3 md:mt-0 mx-4 md:mx-0 md:rounded-xl"
        style="background:var(--surface);border:1px solid rgba(255,255,255,.07);border-radius:0">
        <div class="p-3" style="border-bottom:1px solid rgba(255,255,255,.06)">
          <p class="text-white/40 text-[10px] font-semibold uppercase tracking-widest mb-2">Temporada</p>
          <select id="season-select" onchange="changeSeason(this.value)"
            class="w-full text-white text-sm rounded-lg px-3 py-2 outline-none"
            style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)"></select>
        </div>
        <div id="episodes-list" class="overflow-y-auto scrollbar-hide" style="max-height:45vh"></div>
      </div>

    </div>
  </div>
</div>

<!-- ── MODAL ───────────────────────────────────────────────────── -->
<div id="modal" class="hidden fixed inset-0 z-[150] bg-black/80 flex items-end sm:items-center justify-center sm:p-4 fade-in" onclick="closeModalOutside(event)" style="backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)">
  <div class="rounded-t-2xl sm:rounded-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto shadow-2xl" style="background:var(--surface);border:1px solid rgba(255,255,255,.08)">
    <div class="relative">
      <img id="modal-backdrop" src="" alt="" class="w-full aspect-video object-cover rounded-t-2xl" />
      <div class="absolute inset-0 bg-gradient-to-t from-[#161616] via-transparent to-transparent rounded-t-2xl"></div>
      <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/60 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-black transition-colors text-sm" style="border:1px solid rgba(255,255,255,.1)">✕</button>
      <div class="absolute bottom-4 left-4 flex gap-2">
        <button id="modal-play-btn" class="btn-primary !text-sm !px-4 !py-2">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Assistir
        </button>
      </div>
    </div>
    <div id="modal-body" class="p-4 md:p-6"></div>
  </div>
</div>


<script src="app.js"></script>
</body>
</html>
